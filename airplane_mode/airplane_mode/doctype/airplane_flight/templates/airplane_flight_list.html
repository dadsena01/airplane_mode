{% extends "templates/web.html" %}

{% block page_content %}
<div class="py-8">
	<h1 class="text-3xl font-bold mb-6">Flights</h1>

	<div data-doctype="{{ doctype }}" data-txt="{{ (txt or '') | e }}">
		{% if not result %}
		<div class="text-muted" style="min-height: 300px;">
			{{ no_result_message or "No flights found" }}
		</div>
		{% else %}
		<div class="result">
			{% for item in result %}
			{{ item }}
			{% endfor %}
		</div>
		{% endif %}
		<button class="btn btn-light btn-more my-4 {% if not show_more %}hidden{% endif %}">{{ _("Load More") }}</button>
	</div>
</div>
{% endblock %}
